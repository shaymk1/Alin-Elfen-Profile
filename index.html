
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Profile</title>
<style>
  body, html { margin: 0; padding: 0; font-family: sans-serif; }
  nav { position: fixed; top: 0; width: 100%; background: #111; padding: 10px; display: flex; justify-content: center; gap: 5px; z-index: 10; flex-wrap: wrap;}
  button { padding: 8px 12px; border: none; cursor: pointer; background: #57398F; color: white; border-radius: 5px;}
  .section { width: 100%; }
  .section img { width: 100%; height: auto; display: block; }
  body { scroll-behavior: smooth; }
</style>
</head>
<body>

<nav>
  <button onclick="scrollToSection('cover')">Cover</button>
  <button onclick="scrollToSection('about')">About Us</button>
  <button onclick="scrollToSection('services')">Services</button>
  <button onclick="scrollToSection('clients')">Clients</button>
  <button onclick="scrollToSection('accreditations')">Accreditations</button>
  <button onclick="scrollToSection('contact')">Contact</button>
</nav>

<div class="section" id="cover"><img src="cover-i.jpg" alt="Cover"></div>
<div class="section" id="about"><img src="about-us-i.jpg" alt="About Us"></div>
<div class="section" id="services"><img src="services-i.jpg" alt="Services"></div>
<div class="section" id="clients"><img src="clients-i.jpg" alt="Clients"></div>
<div class="section" id="accreditations"><img src="accreditations-i.jpg" alt="Accreditations"></div>
<div class="section" id="contact"><img src="contact-i.jpg" alt="Contact"></div>

<script>
  function scrollToSection(id) {
    document.getElementById(id).scrollIntoView({behavior:'smooth'});
  }
</script>

</body>
</html>
